name: VYNIX Android Beta
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-beta.yml'
permissions:
  contents: read
concurrency:
  group: vynix-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout VYNIX source
        uses: actions/checkout@v4

      - name: Cache stable Android debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: vynix-spotify-debug-keystore-v1

      - name: Download official Spotify App Remote SDK
        run: |
          mkdir -p app/libs
          curl --fail --location --retry 3 --retry-delay 2 \
            https://raw.githubusercontent.com/spotify/android-sdk/master/app-remote-lib/spotify-app-remote-release-0.8.0.aar \
            --output app/libs/spotify-app-remote-release-0.8.0.aar

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false

      - name: Build VYNIX from its native source
        env:
          APPLE_MUSIC_DEVELOPER_TOKEN: ${{ secrets.APPLE_MUSIC_DEVELOPER_TOKEN }}
        run: gradle --no-daemon :app:assembleDebug

      - name: Print Spotify Android application fingerprint
        run: |
          keytool -list -v -alias androiddebugkey -keystore ~/.android/debug.keystore -storepass android -keypass android | grep -E 'SHA1:|SHA256:'
          echo "Spotify Dashboard package name: app.vynix"

      - name: Run Android lint and unit tests
        env:
          APPLE_MUSIC_DEVELOPER_TOKEN: ${{ secrets.APPLE_MUSIC_DEVELOPER_TOKEN }}
        run: gradle --no-daemon :app:lintDebug :app:testDebugUnitTest

      - name: Generate APK checksum
        run: |
          cd app/build/outputs/apk/debug
          sha256sum app-debug.apk > SHA256SUMS.txt
          cp app-debug.apk VYNIX-arm64-v8a.apk

      - name: Upload VYNIX APK
        uses: actions/upload-artifact@v4
        with:
          name: VYNIX-Native-APK
          path: |
            app/build/outputs/apk/debug/VYNIX-arm64-v8a.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
